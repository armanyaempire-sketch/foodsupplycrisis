name: Editorial Quality Audit

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1" # Mondays at 08:30 Asia/Kolkata

permissions:
  contents: read

concurrency:
  group: editorial-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Build and audit rendered site
    runs-on: ubuntu-latest
    outputs:
      has_findings: ${{ steps.audit.outputs.has_findings }}
      hard_errors: ${{ steps.audit.outputs.hard_errors }}
      warnings: ${{ steps.audit.outputs.warnings }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Run audit regression tests
        run: python -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Run full read-only audit on every PR and scheduled run
        id: audit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python .github/scripts/audit_site_quality.py

      - name: Enforce findings on site and content pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HARD_ERRORS: ${{ steps.audit.outputs.hard_errors }}
        shell: bash
        run: |
          set -euo pipefail
          changed_site_files="$(git diff --name-only "$BASE_SHA"...HEAD | grep -E '^(src/|public/|astro\.config\.mjs$|package(-lock)?\.json$|tsconfig\.json$)' || true)"
          if [[ -z "$changed_site_files" ]]; then
            echo "No site, content, public asset, build-config or dependency files changed."
            echo "The full audit still ran and its report is attached; pre-existing baseline findings do not block this CI-only change."
            exit 0
          fi

          echo "Site/content files changed:"
          printf '%s\n' "$changed_site_files"
          echo "Blocking audit findings: $HARD_ERRORS"
          if [[ "$HARD_ERRORS" != "0" ]]; then
            echo "Editorial quality audit found blocking problems. Review the uploaded report and fix them manually."
            exit 1
          fi
          echo "No blocking editorial quality findings found."

      - name: Save audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-quality-report-${{ github.run_id }}
          path: quality-audit-report.md
          if-no-files-found: ignore
          retention-days: 30

  publish-weekly-report:
    name: Publish weekly report issue (report-only)
    needs: audit
    if: github.event_name == 'schedule' && needs.audit.outputs.has_findings == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Download audit report
        uses: actions/download-artifact@v4
        with:
          name: editorial-quality-report-${{ github.run_id }}

      - name: Create or refresh weekly findings issue
        uses: actions/github-script@v7
        env:
          REPORT_PATH: quality-audit-report.md
        with:
          script: |
            const fs = require("fs");
            const report = fs.existsSync(process.env.REPORT_PATH)
              ? fs.readFileSync(process.env.REPORT_PATH, "utf8")
              : "The audit reported findings, but its report file was unavailable.";
            const title = "Weekly editorial quality audit — findings";
            const marker = "<!-- weekly-editorial-quality-audit -->";
            const body = [
              marker,
              "Automated, read-only audit of the built site.",
              "Run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
              "",
              report,
              "",
              "This issue is a report only. The workflow never edits articles, commits files, pushes branches, or merges pull requests."
            ].join("\n");
            
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = openIssues.find(issue =>
              !issue.pull_request &&
              (issue.title === title || (issue.body || "").includes(marker))
            );
            
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              core.info("Updated existing report issue #" + existing.number);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info("Created report issue #" + created.data.number);
            }
