name: Editorial Quality Audit

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1" # Mondays at 08:30 Asia/Kolkata

permissions:
  contents: read
  issues: write

concurrency:
  group: editorial-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Build and audit rendered site
    runs-on: ubuntu-latest
    outputs:
      has_findings: ${{ steps.pr_audit.outputs.has_findings || steps.scheduled_audit.outputs.has_findings }}
      hard_errors: ${{ steps.pr_audit.outputs.hard_errors || steps.scheduled_audit.outputs.hard_errors }}
      warnings: ${{ steps.pr_audit.outputs.warnings || steps.scheduled_audit.outputs.warnings }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Run blocking audit on pull requests
        id: pr_audit
        if: github.event_name == 'pull_request'
        run: python .github/scripts/audit_site_quality.py --fail-on-findings

      - name: Run report-only scheduled/main-branch audit
        id: scheduled_audit
        if: github.event_name != 'pull_request'
        run: python .github/scripts/audit_site_quality.py

      - name: Save audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-quality-report-${{ github.run_id }}
          path: quality-audit-report.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Create or refresh weekly findings issue
        if: github.event_name == 'schedule' && steps.scheduled_audit.outputs.has_findings == 'true'
        uses: actions/github-script@v7
        env:
          REPORT_PATH: quality-audit-report.md
        with:
          script: |
            const fs = require("fs");
            const report = fs.existsSync(process.env.REPORT_PATH)
              ? fs.readFileSync(process.env.REPORT_PATH, "utf8")
              : "The audit reported findings, but its report file was unavailable.";
            const title = "Weekly editorial quality audit — findings";
            const marker = "<!-- weekly-editorial-quality-audit -->";
            const body = [
              marker,
              "Automated, read-only audit of the built site.",
              "Run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
              "",
              report,
              "",
              "This issue is a report only. The workflow never edits articles, commits files, pushes branches, or merges pull requests."
            ].join("\n");

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = openIssues.find(issue =>
              !issue.pull_request &&
              (issue.title === title || (issue.body || "").includes(marker))
            );

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              core.info("Updated existing report issue #" + existing.number);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info("Created report issue #" + created.data.number);
            }
